name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# id-token lets npm authenticate through OIDC (trusted publishing); no npm
# token is stored in the repository. Provenance is generated automatically.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore: release'
          commit: 'chore: release'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: true
